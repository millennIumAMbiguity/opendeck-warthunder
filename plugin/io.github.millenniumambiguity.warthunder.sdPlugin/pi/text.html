<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="style.css" />
		<script src="common.js"></script>
		<style>
			textarea { width: 100%; box-sizing: border-box; min-height: 80px; background: #2a2a2e; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 6px; font-family: ui-monospace, monospace; }
			code { color: #ccc; }
			.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
			.chips button { background: #333; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 2px 6px; font-size: 12px; cursor: pointer; }
		</style>
		<script>
			const EXAMPLES = [
				["Overview", "{aircraft}\nIAS {ias}\nALT {alt}"],
				["Energy", "{ias}\n{alt}\n{vs}"],
				["Engine", "THR {throttle}\nRPM {rpm}\nOIL {oil}"],
				["Fuel", "FUEL\n{fuel}%\n{fuelmass} kg"],
				["Imperial", "{ias:kt} kt\n{alt:ft} ft\n{vs:fpm}"],
			];
			let update = () => {};

			function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
				actionInfo = JSON.parse(actionInfo);
				const send = connect(port, uuid, registerEvent, actionInfo);
				const s = actionInfo.payload.settings ?? {};
				const box = document.getElementById("template");
				box.value = s.template ?? "{aircraft}\nIAS {ias}\nALT {alt}";

				const chips = document.getElementById("fields");
				for (const id of ["aircraft", ...FIELDS.map((f) => f.id)]) {
					const b = document.createElement("button");
					b.textContent = `{${id}}`;
					b.onclick = () => {
						box.setRangeText(`{${id}}`, box.selectionStart, box.selectionEnd, "end");
						box.focus();
						update();
					};
					chips.appendChild(b);
				}
				const examples = document.getElementById("examples");
				for (const [name, text] of EXAMPLES) {
					const b = document.createElement("button");
					b.textContent = name;
					b.onclick = () => {
						box.value = text;
						update();
					};
					examples.appendChild(b);
				}

				update = () => send({ template: box.value });
			}
		</script>
	</head>
	<body>
		<textarea id="template" oninput="update()"></textarea>
		<p class="hint">Placeholders (click to insert). Add a unit with a colon: <code>{ias:kt}</code>, <code>{alt:ft}</code>, <code>{vs:fpm}</code>, <code>{fuelmass:lb}</code>.</p>
		<div class="chips" id="fields"></div>
		<h4>Examples</h4>
		<div class="chips" id="examples"></div>
		<p class="hint">A key fits about 3–4 short lines. Font size and alignment are in OpenDeck's title settings.</p>
	</body>
</html>
